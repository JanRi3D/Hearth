[workspace]
resolver = "3"
members = ["crates/hearth-api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/JanRi3D/Hearth"

[workspace.dependencies]
hearth-api = { path = "crates/hearth-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
