[package]
name = "hearth-web"
description = "The Hearth admin UI and setup wizard, compiled to WebAssembly"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hearth-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
leptos = { version = "0.8", features = ["csr"] }
# Must match wasm-bindgen-cli-support in crates/hearth/Cargo.toml exactly.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlDocument", "Location", "History", "Navigator", "Clipboard", "HtmlTextAreaElement", "HtmlElement", "Element", "Node", "Storage", "HtmlInputElement", "File", "FileList", "XmlHttpRequest", "XmlHttpRequestUpload", "ProgressEvent"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Renders the news preview. Raw HTML in a post is turned into text before it gets here.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
console_error_panic_hook = "0.1"
